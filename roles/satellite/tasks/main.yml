---
- name: Include user settings tasks
  when: rh_discovery_seapp_satellite_set_hostuser | bool
  ansible.builtin.include_tasks:
    file: user.yml

- name: Include reset admin password tasks
  when: rh_discovery_seapp_satellite_reset_password | bool
  ansible.builtin.include_tasks:
    file: password.yml

- name: Include update satellite hostname tasks
  when: rh_discovery_seapp_satellite_update_hostname | bool
  ansible.builtin.include_tasks:
    file: hostname.yml

- name: Include LeCertificate for satellite
  when: rh_discovery_seapp_satellite_create_lecertificate | bool
  ansible.builtin.include_tasks:
    file: lecertificate.yml

- name: Include replace satellite manifest tasks
  when: rh_discovery_seapp_satellite_replace_manifest | bool
  ansible.builtin.include_tasks:
    file: manifest.yml

- name: Refresh the manifest or replace if expired
  when: not rh_discovery_seapp_satellite_replace_manifest | bool
  block:
    - name: Attempt to refresh the manifest
      ansible.builtin.command: >-
        hammer subscription
        refresh-manifest
        --organization="{{ rh_discovery_seapp_satellite_default_organization }}"
      register: refresh_result
      changed_when: true

  rescue:
    - name: Check if manifest is expired
      ansible.builtin.set_fact:
        manifest_expired: "{{ 'expired' in refresh_result.stderr | default('') }}"

    - name: Fail if manifest URL not configured for auto-replacement
      when:
        - manifest_expired | bool
        - rh_discovery_seapp_satellite_manifest_url is not defined or
          rh_discovery_seapp_satellite_manifest_url == '<CHANGEME>https://example.com/path/to/new_manifest.zip<CHANGEME>'
      ansible.builtin.fail:
        msg: |
          Manifest refresh failed because the manifest has expired.
          To auto-replace the expired manifest, set:
            rh_discovery_seapp_satellite_manifest_url: "https://your-manifest-url.zip"

    - name: Replace expired manifest
      when: manifest_expired | bool
      ansible.builtin.include_tasks:
        file: manifest.yml

    - name: Sync repositories after manifest replacement
      when:
        - manifest_expired | bool
        - rh_discovery_seapp_satellite_sync_repos | default(false) | bool
      ansible.builtin.include_tasks:
        file: sync_repos.yml

    - name: Re-raise non-expiration errors
      when: not manifest_expired | bool
      ansible.builtin.fail:
        msg: "{{ refresh_result.stderr | default('Manifest refresh failed') }}"
