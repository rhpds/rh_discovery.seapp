---
- name: Sync all repositories (fire-and-forget)
  ansible.builtin.command: >-
    hammer repository synchronize
    --organization="{{ rh_discovery_seapp_satellite_default_organization }}"
    --async
  async: 3600
  poll: 0
  register: sync_job
  changed_when: true

- name: Log repository sync job ID
  ansible.builtin.debug:
    msg: "Repository sync started in background. Job ID: {{ sync_job.ansible_job_id | default('unknown') }}"
